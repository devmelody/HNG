<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card | Frontend Wizards</title>

  
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <article data-testid="test-profile-card">
    <figure>
      <img
        data-testid="test-user-avatar"
        src="https://i.pravatar.cc/400?img=47"
        alt="My avatar"
      />
    </figure>

    <div class="card-content">
      <header>
        <h2 data-testid="test-user-name">Melody Oyimiebi Ayefuwe</h2>
      </header>

      <p data-testid="test-user-bio">
        Frontend developer passionate about crafting dynamic user experiences.
      </p>

      <p>
        Current time (ms): <span data-testid="test-user-time"></span>
      </p>

      <nav aria-label="Social Links" data-testid="test-user-social-links">
        <ul>
          <li><a data-testid="test-user-social-twitter" href="https://twitter.com/melcamelcase" target="_blank" rel="noopener noreferrer">Twitter</a></li>
          <li><a data-testid="test-user-social-github" href="https://github.com/devmelody" target="_blank" rel="noopener noreferrer">GitHub</a></li>
          <li><a data-testid="test-user-social-linkedin" href="https://linkedin.com/in/melcamelcase" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
        </ul>
      </nav>

      <section>
        <h3>Hobbies</h3>
        <ul data-testid="test-user-hobbies">
          <li>Internet surfing</li>
          <li>Watching movies</li>
        </ul>
      </section>

      <section>
        <h3>Dislikes</h3>
        <ul data-testid="test-user-dislikes">
          <li>Slow websites</li>
          <li>Noise</li>
          <li>Lousiness</li>
        </ul>
      </section>
    </div>
  </article>

  
  <script src="script.js"></script>
</body>
</html>
